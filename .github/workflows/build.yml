name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Prepare project
        run: |
          set -e
          # Backup custom sources from repo
          mkdir -p /tmp/pf_backup
          cp -a lib /tmp/pf_backup/
          cp pubspec.yaml /tmp/pf_backup/
          if [ -d android/app/src/main/kotlin ]; then
            cp -a android/app/src/main/kotlin /tmp/pf_backup/kotlin
          fi
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/pf_backup/AndroidManifest.xml
          fi
          if [ -d android/app/src/main/res ]; then
            cp -a android/app/src/main/res /tmp/pf_backup/res
          fi
          if [ -f android/app/build.gradle.kts ]; then
            cp android/app/build.gradle.kts /tmp/pf_backup/app_build.gradle.kts
          fi
          # Regenerate android platform
          rm -rf android ios web linux macos windows
          flutter create . --project-name powerfiles --org com.powerfiles --platforms=android
          # Restore custom code
          rm -rf lib
          cp -a /tmp/pf_backup/lib .
          cp /tmp/pf_backup/pubspec.yaml .
          mkdir -p android/app/src/main/kotlin
          if [ -d /tmp/pf_backup/kotlin ]; then
            cp -a /tmp/pf_backup/kotlin/. android/app/src/main/kotlin/
          fi
          if [ -d /tmp/pf_backup/res ]; then
            cp -a /tmp/pf_backup/res/. android/app/src/main/res/
          fi
          if [ -f /tmp/pf_backup/AndroidManifest.xml ]; then
            cp /tmp/pf_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi
          if [ -f /tmp/pf_backup/app_build.gradle.kts ]; then
            cp /tmp/pf_backup/app_build.gradle.kts android/app/build.gradle.kts
          fi
          # Fixed keystore every CI run
          keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          BG=android/app/build.gradle.kts
          # Ensure signing config
          if ! grep -q 'storeFile = file("debug.keystore")' "$BG"; then
            sed -i '/defaultConfig {/a\    signingConfigs {\n        getByName("debug") {\n            storeFile = file("debug.keystore")\n            storePassword = "android"\n            keyAlias = "androiddebugkey"\n            keyPassword = "android"\n        }\n    }' "$BG" || true
          fi
          if ! grep -q 'signingConfig = signingConfigs.getByName("debug")' "$BG"; then
            sed -i '/release {/a\            signingConfig = signingConfigs.getByName("debug")' "$BG" || true
          fi
          sed -i 's/large\.take(n)\.asMap()/large.take(n).toList().asMap()/g' lib/features/telegram_bot/telegram_settings_screen.dart || true
          if ! grep -q dependency_overrides pubspec.yaml; then
            printf '\ndependency_overrides:\n  path: ^1.9.1\n  permission_handler: ^12.0.0\n' >> pubspec.yaml
          fi
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' "$BG" || true
          sed -i 's/minSdk = [0-9]*/minSdk = 26/' "$BG" || true
          if grep -q ndkVersion "$BG"; then
            sed -i 's/ndkVersion = ".*"/ndkVersion = "27.0.12077973"/' "$BG"
          else
            sed -i '/compileSdk/a\    ndkVersion = "27.0.12077973"' "$BG"
          fi
          if ! grep -q documentfile "$BG"; then
            printf '\ndependencies {\n    implementation("androidx.documentfile:documentfile:1.0.1")\n    implementation("androidx.work:work-runtime-ktx:2.9.1")\n    implementation("androidx.core:core-ktx:1.13.1")\n    implementation("androidx.appcompat:appcompat:1.7.0")\n    implementation("androidx.multidex:multidex:2.0.1")\n}\n' >> "$BG"
          fi
          SAF=android/app/src/main/kotlin/com/powerfiles/channels/SAFChannel.kt
          if [ -f "$SAF" ] && ! grep -q androidx.documentfile "$SAF"; then
            sed -i '1a import androidx.documentfile.provider.DocumentFile' "$SAF"
          fi
          echo 'android.newDsl=false' >> android/gradle.properties
          echo 'android.builtInKotlin=false' >> android/gradle.properties
          echo 'Prepared'
          ls lib/ android/app/src/main/kotlin/com/powerfiles/channels/ 2>/dev/null || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release
          find build -name "*.apk" -type f || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: powerfiles-apk-v7
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn

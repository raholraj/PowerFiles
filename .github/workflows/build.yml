name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Download + prepare project
        run: |
          set -e
          curl -L -o src_raw.zip "https://filebin.net/bdcjsrgq4aezhni9/powerfiles_v7.zip" || true
          python3 -c "
          data=open('src_raw.zip','rb').read()
          i=data.find(b'PK\\x03\\x04')
          if i<0: i=data.find(b'PK')
          open('src.zip','wb').write(data[i:] if i>=0 else data)
          print('zip ok', len(data))
          "
          mkdir -p project
          unzip -o src.zip -d project || true
          if [ ! -f project/pubspec.yaml ]; then
            DIR=$(find project -name pubspec.yaml -exec dirname {} \; | head -1)
            cp -a "$DIR"/. project/ || true
          fi
          test -f project/pubspec.yaml
          cd project

          sed -i 's/permission_handler: \^[0-9.]*/permission_handler: ^12.0.0/' pubspec.yaml
          if ! grep -q dependency_overrides pubspec.yaml; then
            printf '\ndependency_overrides:\n  path: ^1.9.1\n  permission_handler: ^12.0.0\n' >> pubspec.yaml
          fi

          mkdir -p /tmp/pf_backup
          cp -a lib /tmp/pf_backup/
          cp pubspec.yaml /tmp/pf_backup/
          cp -a android/app/src/main/kotlin /tmp/pf_backup/kotlin || true
          cp android/app/src/main/AndroidManifest.xml /tmp/pf_backup/AndroidManifest.xml || true
          cp -a android/app/src/main/res /tmp/pf_backup/res || true
          cp android/app/debug.keystore /tmp/pf_backup/debug.keystore 2>/dev/null || true
          cp android/app/build.gradle.kts /tmp/pf_backup/app_build.gradle.kts 2>/dev/null || true

          rm -rf android ios web linux macos windows
          flutter create . --project-name powerfiles --org com.powerfiles --platforms=android --no-pub

          rm -rf lib
          cp -a /tmp/pf_backup/lib .
          cp /tmp/pf_backup/pubspec.yaml .
          mkdir -p android/app/src/main/kotlin
          cp -a /tmp/pf_backup/kotlin/. android/app/src/main/kotlin/ || true
          cp -a /tmp/pf_backup/res/. android/app/src/main/res/ || true
          cp /tmp/pf_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml || true

          if [ -f /tmp/pf_backup/debug.keystore ]; then
            cp /tmp/pf_backup/debug.keystore android/app/debug.keystore
          else
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          fi
          if [ -f /tmp/pf_backup/app_build.gradle.kts ]; then
            cp /tmp/pf_backup/app_build.gradle.kts android/app/build.gradle.kts
          fi

          # Dart asMap fix
          find lib -name "*.dart" -exec sed -i 's/\.take(\([^)]*\))\.asMap()/.take(\1).toList().asMap()/g' {} \; || true

          # Kotlin Sequence -> List + remove empty ScanService class
          SC=android/app/src/main/kotlin/com/powerfiles/channels/StorageChannel.kt
          if [ -f "$SC" ]; then
            python3 << 'PY'
p="android/app/src/main/kotlin/com/powerfiles/channels/StorageChannel.kt"
t=open(p).read()
if "findLargeFiles" in t and ".toList()" not in t[t.find("findLargeFiles"):t.find("findLargeFiles")+600]:
    t=t.replace(
        '''            .map { file ->
                mapOf(
                    "name" to file.name,
                    "path" to file.absolutePath,
                    "size" to file.length(),
                    "lastModified" to file.lastModified(),
                    "extension" to file.extension
                )
            }
    }''',
        '''            .map { file ->
                mapOf(
                    "name" to file.name,
                    "path" to file.absolutePath,
                    "size" to file.length(),
                    "lastModified" to file.lastModified(),
                    "extension" to file.extension
                )
            }
            .toList()
    }'''
    )
import re
t=re.sub(r'(private fun findLargeFiles[\s\S]{50,400}?\.map \{[\s\S]*?\})\s*\n(\s*\})', r'\1\n            .toList()\n\2', t, count=1)
open(p,'w').write(t)
print('StorageChannel patched')
PY
          fi

          SS=android/app/src/main/kotlin/com/powerfiles/services/ScanService.kt
          if [ -f "$SS" ]; then
            sed -i '/^class ScanService$/d' "$SS" || true
          fi

          MF=android/app/src/main/AndroidManifest.xml
          if [ -f "$MF" ]; then
            python3 -c '
import re
p="android/app/src/main/AndroidManifest.xml"
t=open(p).read()
t=re.sub(r"\s*<!--[^>]*Service[^>]*-->\s*<service[\s\S]*?android:exported=\"false\"\s*/>\s*", "\n", t)
t=re.sub(r"\s*<service[\s\S]*?ScanService[\s\S]*?/>\s*", "\n", t)
open(p,"w").write(t)
print("manifest cleaned")
'
          fi

          BG=android/app/build.gradle.kts
          sed -i 's/compileSdk = [0-9]*/compileSdk = 35/' "$BG" || true
          sed -i 's/targetSdk = [0-9]*/targetSdk = 35/' "$BG" || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' "$BG" || true
          sed -i 's/minSdk = [0-9]*/minSdk = 26/' "$BG" || true
          if grep -q ndkVersion "$BG"; then
            sed -i 's/ndkVersion = ".*"/ndkVersion = "27.0.12077973"/' "$BG"
          else
            sed -i '/compileSdk/a\    ndkVersion = "27.0.12077973"' "$BG"
          fi
          if ! grep -q documentfile "$BG"; then
            printf '\ndependencies {\n    implementation("androidx.documentfile:documentfile:1.0.1")\n    implementation("androidx.work:work-runtime-ktx:2.9.1")\n    implementation("androidx.core:core-ktx:1.13.1")\n    implementation("androidx.appcompat:appcompat:1.7.0")\n    implementation("androidx.multidex:multidex:2.0.1")\n}\n' >> "$BG"
          fi
          if ! grep -q "lint {" "$BG"; then
            sed -i '/android {/a\    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }' "$BG" || true
          fi
          SAF=android/app/src/main/kotlin/com/powerfiles/channels/SAFChannel.kt
          if [ -f "$SAF" ] && ! grep -q androidx.documentfile "$SAF"; then
            sed -i '1a import androidx.documentfile.provider.DocumentFile' "$SAF"
          fi
          echo 'android.newDsl=false' >> android/gradle.properties
          echo 'android.builtInKotlin=false' >> android/gradle.properties
          echo '--- READY ---'
          grep -n compileSdk "$BG" || true
          grep -n toList "$SC" || true
          grep -n ScanService "$MF" || echo "no ScanService in manifest"
          grep -n "class ScanService" "$SS" || echo "no empty ScanService class"

      - name: Get dependencies
        working-directory: project
        run: flutter pub get

      - name: Build APK
        working-directory: project
        run: |
          flutter build apk --release
          find build -name "*.apk" -type f || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: powerfiles-apk-v7
          path: project/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn

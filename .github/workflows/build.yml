name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Reconstruct source zip + prepare project
        run: |
          set -e
          cat src/v6part_00 src/v6part_01 src/v6part_02 | base64 -d > src.zip
          mkdir -p project && unzip -o src.zip -d project
          if [ ! -f project/pubspec.yaml ]; then
            DIR=$(find project -name pubspec.yaml -exec dirname {} \; | head -1)
            cp -a "$DIR"/. project/
          fi
          cd project
          mkdir -p /tmp/pf_backup
          cp -a lib /tmp/pf_backup/
          cp pubspec.yaml /tmp/pf_backup/
          cp -a android/app/src/main/kotlin /tmp/pf_backup/kotlin || true
          cp android/app/src/main/AndroidManifest.xml /tmp/pf_backup/AndroidManifest.xml || true
          cp -a android/app/src/main/res /tmp/pf_backup/res || true
          cp android/app/debug.keystore /tmp/pf_backup/debug.keystore 2>/dev/null || true
          cp android/app/build.gradle.kts /tmp/pf_backup/app_build.gradle.kts 2>/dev/null || true
          rm -rf android ios web linux macos windows
          flutter create . --project-name powerfiles --org com.powerfiles --platforms=android
          rm -rf lib
          cp -a /tmp/pf_backup/lib .
          cp /tmp/pf_backup/pubspec.yaml .
          mkdir -p android/app/src/main/kotlin
          cp -a /tmp/pf_backup/kotlin/. android/app/src/main/kotlin/ || true
          cp -a /tmp/pf_backup/res/. android/app/src/main/res/ || true
          cp /tmp/pf_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml || true
          if [ -f /tmp/pf_backup/debug.keystore ]; then
            cp /tmp/pf_backup/debug.keystore android/app/debug.keystore
          else
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          fi
          if [ -f /tmp/pf_backup/app_build.gradle.kts ]; then
            cp /tmp/pf_backup/app_build.gradle.kts android/app/build.gradle.kts
          fi
          sed -i 's/large\.take(n)\.asMap()/large.take(n).toList().asMap()/g' lib/features/telegram_bot/telegram_settings_screen.dart || true
          if ! grep -q dependency_overrides pubspec.yaml; then
            printf '\ndependency_overrides:\n  path: ^1.9.1\n  permission_handler: ^12.0.0\n' >> pubspec.yaml
          fi
          BG=android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' "$BG" || true
          sed -i 's/minSdk = [0-9]*/minSdk = 26/' "$BG" || true
          if grep -q ndkVersion "$BG"; then
            sed -i 's/ndkVersion = ".*"/ndkVersion = "27.0.12077973"/' "$BG"
          else
            sed -i '/compileSdk/a\    ndkVersion = "27.0.12077973"' "$BG"
          fi
          if ! grep -q documentfile "$BG"; then
            printf '\ndependencies {\n    implementation("androidx.documentfile:documentfile:1.0.1")\n    implementation("androidx.work:work-runtime-ktx:2.9.1")\n    implementation("androidx.core:core-ktx:1.13.1")\n    implementation("androidx.appcompat:appcompat:1.7.0")\n    implementation("androidx.multidex:multidex:2.0.1")\n}\n' >> "$BG"
          fi
          SAF=android/app/src/main/kotlin/com/powerfiles/channels/SAFChannel.kt
          if [ -f "$SAF" ] && ! grep -q androidx.documentfile "$SAF"; then
            sed -i '1a import androidx.documentfile.provider.DocumentFile' "$SAF"
          fi
          echo 'android.newDsl=false' >> android/gradle.properties
          echo 'android.builtInKotlin=false' >> android/gradle.properties
          echo '--- app/build.gradle.kts tail ---'
          tail -40 "$BG"
          echo '--- pubspec tail ---'
          tail -15 pubspec.yaml

      - name: Get dependencies
        working-directory: project
        run: flutter pub get

      - name: Build APK
        working-directory: project
        run: |
          flutter build apk --release
          find build -name "*.apk" -type f || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: powerfiles-apk-v6
          path: project/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn

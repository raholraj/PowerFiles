name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Download + prepare project
        run: |
          set -e
          curl -L -o src.zip "https://litter.catbox.moe/9kvaor.zip"
          mkdir -p project
          unzip -o src.zip -d project
          if [ ! -f project/pubspec.yaml ]; then
            DIR=$(find project -name pubspec.yaml -exec dirname {} \; | head -1)
            cp -a "$DIR"/. project/
          fi
          cd project

          mkdir -p /tmp/pf_backup
          cp -a lib /tmp/pf_backup/
          cp pubspec.yaml /tmp/pf_backup/
          cp -a android/app/src/main/kotlin /tmp/pf_backup/kotlin 2>/dev/null || true
          cp android/app/src/main/AndroidManifest.xml /tmp/pf_backup/AndroidManifest.xml 2>/dev/null || true
          cp -a android/app/src/main/res /tmp/pf_backup/res 2>/dev/null || true

          rm -rf android ios web linux macos windows
          flutter create . --project-name powerfiles --org com.powerfiles --platforms=android

          rm -rf lib
          cp -a /tmp/pf_backup/lib .
          cp /tmp/pf_backup/pubspec.yaml .

          mkdir -p android/app/src/main/kotlin
          if [ -d /tmp/pf_backup/kotlin ]; then
            cp -a /tmp/pf_backup/kotlin/. android/app/src/main/kotlin/
          fi
          if [ -d /tmp/pf_backup/res ]; then
            cp -a /tmp/pf_backup/res/. android/app/src/main/res/ || true
          fi
          if [ -f /tmp/pf_backup/AndroidManifest.xml ]; then
            cp /tmp/pf_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

          # Fix Dart: Iterable has no asMap — need toList()
          sed -i 's/large\.take(n)\.asMap()/large.take(n).toList().asMap()/g' lib/features/telegram_bot/telegram_settings_screen.dart

          # NDK 27 for plugins
          if [ -f android/app/build.gradle.kts ]; then
            grep -q 'ndkVersion' android/app/build.gradle.kts || sed -i '/compileSdk/a\    ndkVersion = "27.0.12077973"' android/app/build.gradle.kts
            sed -i 's/ndkVersion = ".*"/ndkVersion = "27.0.12077973"/' android/app/build.gradle.kts || true
          fi
          if [ -f android/app/build.gradle ]; then
            grep -q 'ndkVersion' android/app/build.gradle || sed -i '/compileSdk/a\    ndkVersion "27.0.12077973"' android/app/build.gradle
            sed -i 's/ndkVersion ".*"/ndkVersion "27.0.12077973"/' android/app/build.gradle || true
          fi

          grep -q 'android.newDsl=false' android/gradle.properties || echo 'android.newDsl=false' >> android/gradle.properties
          grep -q 'android.builtInKotlin=false' android/gradle.properties || echo 'android.builtInKotlin=false' >> android/gradle.properties

          echo "--- app build.gradle ---"
          cat android/app/build.gradle.kts 2>/dev/null || cat android/app/build.gradle

      - name: Get dependencies
        working-directory: project
        run: flutter pub get

      - name: Build APK
        working-directory: project
        run: |
          flutter build apk --release
          find build -name "*.apk" -type f || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: powerfiles-apk-v5
          path: project/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn

name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Download + prepare project
        run: |
          set -e
          curl -L -o src.zip "https://litter.catbox.moe/9kvaor.zip"
          mkdir -p project
          unzip -o src.zip -d project
          if [ ! -f project/pubspec.yaml ]; then
            DIR=$(find project -name pubspec.yaml -exec dirname {} \; | head -1)
            cp -a "$DIR"/. project/
          fi
          cd project

          mkdir -p /tmp/pf_backup
          cp -a lib /tmp/pf_backup/
          cp pubspec.yaml /tmp/pf_backup/
          cp -a android/app/src/main/kotlin /tmp/pf_backup/kotlin 2>/dev/null || true
          cp android/app/src/main/AndroidManifest.xml /tmp/pf_backup/AndroidManifest.xml 2>/dev/null || true
          cp -a android/app/src/main/res /tmp/pf_backup/res 2>/dev/null || true

          rm -rf android ios web linux macos windows
          flutter create . --project-name powerfiles --org com.powerfiles --platforms=android

          rm -rf lib
          cp -a /tmp/pf_backup/lib .
          cp /tmp/pf_backup/pubspec.yaml .

          mkdir -p android/app/src/main/kotlin
          [ -d /tmp/pf_backup/kotlin ] && cp -a /tmp/pf_backup/kotlin/. android/app/src/main/kotlin/
          [ -d /tmp/pf_backup/res ] && cp -a /tmp/pf_backup/res/. android/app/src/main/res/ || true
          [ -f /tmp/pf_backup/AndroidManifest.xml ] && cp /tmp/pf_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

          # Fix Dart asMap on Iterable
          sed -i 's/large\.take(n)\.asMap()/large.take(n).toList().asMap()/g' lib/features/telegram_bot/telegram_settings_screen.dart

          # Patch Gradle (kts or groovy) for minSdk + NDK
          BG=""
          [ -f android/app/build.gradle.kts ] && BG=android/app/build.gradle.kts
          [ -f android/app/build.gradle ] && BG=android/app/build.gradle
          echo "Patching $BG"
          # minSdk
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' "$BG" || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdk 26/' "$BG" || true
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 26/' "$BG" || true
          sed -i 's/minSdk = [0-9]*/minSdk = 26/' "$BG" || true
          # ndkVersion
          if grep -q 'ndkVersion' "$BG"; then
            sed -i 's/ndkVersion = ".*"/ndkVersion = "27.0.12077973"/' "$BG" || true
            sed -i 's/ndkVersion ".*"/ndkVersion "27.0.12077973"/' "$BG" || true
          else
            # insert after compileSdk line
            sed -i '/compileSdk/a\    ndkVersion = "27.0.12077973"' "$BG" || true
          fi

          grep -q 'android.newDsl=false' android/gradle.properties || echo 'android.newDsl=false' >> android/gradle.properties
          grep -q 'android.builtInKotlin=false' android/gradle.properties || echo 'android.builtInKotlin=false' >> android/gradle.properties

          echo "=== patched build file ==="
          cat "$BG"

      - name: Get dependencies
        working-directory: project
        run: flutter pub get

      - name: Build APK
        working-directory: project
        run: |
          flutter build apk --release
          find build -name "*.apk" -type f || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: powerfiles-apk-v5
          path: project/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn

name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Download source zip
        run: |
          curl -L -o src.zip "https://litter.catbox.moe/p93tys.zip"
          mkdir -p project
          unzip -o src.zip -d project
          if [ -f project/pubspec.yaml ]; then echo Flat; else DIR=$(find project -name pubspec.yaml -exec dirname {} \; | head -1); cp -a "$DIR"/. project/; fi
          grep -q 'android.newDsl=false' project/android/gradle.properties || echo 'android.newDsl=false' >> project/android/gradle.properties
          ls project/
          echo "--- settings ---"
          cat project/android/settings.gradle.kts
          echo "--- properties ---"
          cat project/android/gradle.properties

      - name: Get dependencies
        working-directory: project
        run: flutter pub get

      - name: Build APK
        working-directory: project
        run: |
          flutter build apk --release
          find build -name "*.apk" -type f || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: powerfiles-apk-v5
          path: project/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn

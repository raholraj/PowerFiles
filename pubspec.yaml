name: powerfiles
description: Professional Android File Manager + AI + Terminal + Telegram Bot
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.0.0

  # Networking (AI APIs + Telegram)
  http: ^1.2.0

  # File Operations
  path_provider: ^2.1.0
  share_plus: ^10.0.0
  open_filex: ^4.5.0

  # UI
  shimmer: ^3.0.0
  google_fonts: ^6.2.1

  # Charts (Storage Analyzer)
  fl_chart: ^0.68.0

  # Code Editor
  flutter_code_editor: ^0.3.2
  highlight: ^0.7.0

  # Permissions
  permission_handler: ^11.3.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0
  crypto: ^3.0.0
  mime: ^1.0.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
